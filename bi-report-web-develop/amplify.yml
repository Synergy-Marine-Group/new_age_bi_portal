# Repo root for synergy-bi-portal / bi-report-web-develop (Amplify connects this repository).
# Parent monorepo: copy amplify.parent-monorepo.yml to the parent repo root as amplify.yml.
version: 1
applications:
  - appRoot: apps/portal
    frontend:
      phases:
        preBuild:
          commands:
            - echo "amplify.yml spec lambda-db-bridge-v3 (repo root apps/portal)"
            - npm ci
        build:
          commands:
            - node scripts/amplify-write-env-production.mjs
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*