version: 1

applications:
  # ==========================================
  # APPLICATION 1: BI PORTAL WEB
  # ==========================================
  - appRoot: bi-report-web-develop/apps/portal
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci

        build:
          commands:
            # Expose server-side environment variables to Next.js SSR
            - env | grep -e '^MICROSOFT_TENANT_ID=' >> .env.production || true
            - env | grep -e '^MICROSOFT_CLIENT_ID=' >> .env.production || true
            - env | grep -e '^MICROSOFT_CLIENT_SECRET=' >> .env.production || true
            - env | grep -e '^MICROSOFT_REDIRECT_URI=' >> .env.production || true
            - env | grep -e '^JWT_SECRET=' >> .env.production || true

            # Preserve public frontend environment variables
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true

            # Lambda DB bridge (Amplify SSR → Lambda → RDS)
            - env | grep -e '^LAMBDA_DB_BRIDGE_URL=' >> .env.production || true
            - env | grep -e '^LAMBDA_DB_BRIDGE_SECRET=' >> .env.production || true

            # Optional: direct Postgres on Amplify (omit env var when using bridge only)
            - env | grep -e '^SQL_CONNECTION_STRING=' >> .env.production || true

            # Build Next.js application
            - npm run build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*