# Used when Amplify "App root" is set to apps/portal and build spec is read from this folder.
# Default Amplify monorepo layout uses /amplify.yml at the Git repository root instead.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "amplify.yml spec lambda-db-bridge-v3 (apps/portal)"
        - npm ci
    build:
      commands:
        - node scripts/amplify-write-env-production.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*