version: 1
applications:
  - appRoot: apps/portal
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Write server-side variables to .env.production for Next.js SSR.
            # Only variables that are set are written; missing ones are skipped (no failure).
            - |
              for v in MICROSOFT_TENANT_ID MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET MICROSOFT_REDIRECT_URI JWT_SECRET LAMBDA_DB_BRIDGE_URL LAMBDA_DB_BRIDGE_SECRET; do
                if [ -n "${!v}" ]; then printf '%s="%s"\n' "$v" "${!v}" >> .env.production; fi
              done
              true
            - |
              env | grep '^NEXT_PUBLIC_' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*