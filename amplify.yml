version: 1

applications:

  # ==========================================
  # APPLICATION 1: BI PORTAL WEB
  # ==========================================
  - appRoot: bi-report-web-develop/apps/portal

    frontend:
      phases:
        preBuild:
          commands:
            - npm ci

        build:
          commands:
            # Expose server-side environment variables to Next.js SSR
            - env | grep -e '^MICROSOFT_TENANT_ID=' >> .env.production
            - env | grep -e '^MICROSOFT_CLIENT_ID=' >> .env.production
            - env | grep -e '^MICROSOFT_CLIENT_SECRET=' >> .env.production
            - env | grep -e '^MICROSOFT_REDIRECT_URI=' >> .env.production
            - env | grep -e '^JWT_SECRET=' >> .env.production

            # Preserve public frontend environment variables
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production

            # Build Next.js application
            - npm run build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*