
version: 1

applications:

  # ==========================================
  # APPLICATION 1: BI PORTAL WEB
  # ==========================================
  - appRoot: bi-report-web-develop/apps/portal

    frontend:
      phases:
        preBuild:
          commands:
            - npm ci

        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
